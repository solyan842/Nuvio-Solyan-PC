name: Build Native PlayTorrio Header A-B Package
# DLL source change: solyan-ab-playtorrio-native-headers @ 96b5b0a2d29a94471ed8c4c379cd2f6581437c4b

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/windows-native-header-ab.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify native A-B patch package
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44

    steps:
      - name: Check out native A-B branch
        uses: actions/checkout@v6
        with:
          ref: solyan-ab-playtorrio-native-headers
          fetch-depth: 1
          lfs: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache
          $root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          $lib = Join-Path $root "build\native\x64\WebView2Loader.dll.lib"
          if (-not (Test-Path $lib)) { throw "WebView2Loader.dll.lib missing" }
          "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build native Windows bridge
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:buildWindowsPlayerBridge `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate PowerShell patch helpers
        shell: pwsh
        run: |
          $scripts = @(
            "tools\native-header-ab\APPLY.ps1",
            "tools\native-header-ab\ROLLBACK.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell syntax validation failed: $script"
            }
            Write-Host "PowerShell syntax OK: $script"
          }

      - name: Verify and collect package
        shell: pwsh
        run: |
          $dll = "composeApp\build\native\windows\player_bridge.dll"
          $pdb = "composeApp\build\native\windows\player_bridge.pdb"
          if (-not (Test-Path $dll)) { throw "player_bridge.dll not produced" }

          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $dll out\player_bridge.dll
          if (Test-Path $pdb) { Copy-Item $pdb out\player_bridge.pdb }
          Copy-Item tools\native-header-ab\APPLY.ps1 out\APPLY.ps1
          Copy-Item tools\native-header-ab\ROLLBACK.ps1 out\ROLLBACK.ps1
          Copy-Item tools\native-header-ab\APPLY.cmd out\APPLY.cmd
          Copy-Item tools\native-header-ab\ROLLBACK.cmd out\ROLLBACK.cmd
          Copy-Item tools\native-header-ab\README.md out\README.md

          $dllHash = (Get-FileHash out\player_bridge.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "SOURCE_BRANCH=solyan-ab-playtorrio-native-headers"
            "DLL_SOURCE_COMMIT=96b5b0a2d29a94471ed8c4c379cd2f6581437c4b"
            "BASE_UPSTREAM=796f10dddfceabdd6ab7e06a7e43b283f28fd2aa"
            "DLL_SHA256=$dllHash"
            "CHANGE=PlayTorrio-compatible default HTTP identity only"
            "SCOPE=Windows native player bridge only"
            "ROLLBACK=Untouched application JAR backup created before patch"
          ) | Set-Content out\PATCH-MANIFEST.txt -Encoding ascii

          $expected = @(
            "player_bridge.dll",
            "APPLY.ps1",
            "ROLLBACK.ps1",
            "APPLY.cmd",
            "ROLLBACK.cmd",
            "README.md",
            "PATCH-MANIFEST.txt"
          )
          foreach ($name in $expected) {
            if (-not (Test-Path (Join-Path out $name))) {
              throw "Missing package file: $name"
            }
          }

          Get-ChildItem out | Sort-Object Name | Format-Table Name,Length
          Get-Content out\PATCH-MANIFEST.txt

      - name: Create ZIP
        shell: pwsh
        run: |
          $zip = "Nuvio-PC-SFilm3-PlayTorrio-Headers-Native-AB.zip"
          Compress-Archive -Path out\* -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "ZIP_SHA256=$zipHash" | Set-Content ZIP-SHA256.txt -Encoding ascii
          Get-Item $zip | Format-List Name,Length,LastWriteTime
          Get-Content ZIP-SHA256.txt

      - name: Upload native A-B package
        uses: actions/upload-artifact@v7
        with:
          name: Nuvio-PC-SFilm3-PlayTorrio-Headers-Native-AB
          path: |
            Nuvio-PC-SFilm3-PlayTorrio-Headers-Native-AB.zip
            ZIP-SHA256.txt
          if-no-files-found: error
          retention-days: 14
