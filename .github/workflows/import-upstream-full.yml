name: Import full NuvioDesktop upstream

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-upstream-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Clone upstream Dev with LFS
        run: |
          git lfs install
          rm -rf /tmp/NuvioDesktop
          git clone --depth 1 --branch Dev https://github.com/NuvioMedia/NuvioDesktop.git /tmp/NuvioDesktop
          cd /tmp/NuvioDesktop
          git lfs pull
          git rev-parse HEAD > /tmp/upstream_sha

      - name: Prepare upstream-dev branch tree
        run: |
          git checkout -B upstream-dev
          rsync -a --delete --exclude '.git' /tmp/NuvioDesktop/ ./

          # GitHub's workflow token cannot create/update active workflow files.
          # Preserve upstream workflow definitions verbatim, but archive them outside
          # .github/workflows so the complete source/environment is still retained.
          if [ -d .github/workflows ]; then
            mkdir -p .upstream-github/workflows
            cp -a .github/workflows/. .upstream-github/workflows/
            rm -rf .github/workflows
          fi

          printf '%s\n' 'NuvioMedia/NuvioDesktop' > UPSTREAM_REPOSITORY
          printf '%s\n' 'Dev' > UPSTREAM_BRANCH
          cat /tmp/upstream_sha > UPSTREAM_COMMIT
          cat > UPSTREAM_WORKFLOWS_NOTE.md <<'EOF'
          # Upstream workflows archive

          The upstream `.github/workflows` files are preserved verbatim under `.upstream-github/workflows/`.
          They are moved out of the active GitHub Actions path only because GitHub does not allow this workflow token to create/update workflow definitions on another branch.

          All application source, Gradle configuration, vendor source, native Windows bridge, runtime files, assets and LFS objects remain at their upstream paths.
          EOF

      - name: Commit and push full source branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          SHA=$(cat /tmp/upstream_sha)
          git commit -m "Import full NuvioDesktop Dev ${SHA:0:7}" || true
          git push --force origin HEAD:upstream-dev
