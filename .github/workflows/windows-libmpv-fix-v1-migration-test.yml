name: Verify A-B to Stable Migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/windows-libmpv-fix-v1-migration-test.yml'

permissions:
  contents: read

jobs:
  migration-test:
    name: Verify current runtime A-B upgrades safely to stable
    runs-on: windows-2022

    steps:
      - name: Check out stable fix branch
        uses: actions/checkout@v6
        with:
          ref: solyan-libmpv-fix-v1
          fetch-depth: 1
          lfs: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch original Nuvio libmpv
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll" --exclude=""
          test -f composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll

      - name: Prepare fixed runtime payload
        shell: pwsh
        run: |
          $url = "https://github.com/Predidit/libmpv-win32-video-cmake/releases/download/202609151348/mpv-dev-x86_64-20260915-git-0b7ed67.7z"
          $archive = Join-Path $env:RUNNER_TEMP "mpv-fixed.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing

          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne "8adceab30b6bcc5503fa9d3823b68f4acd15ee1c41d6dc2492826f373531c10a") {
            throw "Fixed runtime archive hash mismatch"
          }

          $extract = Join-Path $env:RUNNER_TEMP "mpv-fixed"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & 7z.exe x $archive "-o$extract" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed" }

          $dll = Get-ChildItem $extract -Recurse -File -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) { throw "Fixed libmpv not found" }

          $hash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "361e3a306707454a24e7d3558b2eb7a9ccc23a4f5ed396fe7e77f0a44908eda5") {
            throw "Fixed libmpv hash mismatch"
          }

          Copy-Item $dll.FullName tools\libmpv-fix-v1\libmpv-2.dll -Force

      - name: Simulate working A-B then adopt as stable
        shell: powershell
        run: |
          $originalDll = (Resolve-Path "composeApp\src\desktopMain\native\windows\runtime\libmpv-2.dll").Path
          $fixedDll = (Resolve-Path "tools\libmpv-fix-v1\libmpv-2.dll").Path

          $sandbox = Join-Path $env:RUNNER_TEMP "nuvio-ab-to-stable"
          Remove-Item $sandbox -Recurse -Force -ErrorAction SilentlyContinue

          $jarRoot = Join-Path $sandbox "jarroot"
          $nativeDir = Join-Path $jarRoot "native\windows"
          New-Item -ItemType Directory -Force -Path $nativeDir | Out-Null

          Copy-Item $originalDll (Join-Path $nativeDir "libmpv-2.dll") -Force
          [IO.File]::WriteAllBytes(
            (Join-Path $nativeDir "player_bridge.dll"),
            [Text.Encoding]::ASCII.GetBytes("UNPATCHED-PLAYER-BRIDGE")
          )

          $jar = Join-Path $sandbox "composeApp-desktop-adoption.jar"
          & jar --create --file $jar -C $jarRoot .
          if ($LASTEXITCODE -ne 0) { throw "jar create failed" }

          $legacyBackup = "$jar.solyan-sfilm3-libmpv-ab-original.bak"
          Copy-Item $jar $legacyBackup -Force
          $originalHash = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLowerInvariant()

          $patchRoot = Join-Path $sandbox "patchroot"
          $patchNative = Join-Path $patchRoot "native\windows"
          New-Item -ItemType Directory -Force -Path $patchNative | Out-Null
          Copy-Item $fixedDll (Join-Path $patchNative "libmpv-2.dll") -Force

          & jar --update --file $jar -C $patchRoot "native/windows/libmpv-2.dll"
          if ($LASTEXITCODE -ne 0) { throw "jar update failed" }

          $abJarHash = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLowerInvariant()

          $output = (& "tools\libmpv-fix-v1\APPLY.ps1" -JarPath $jar 2>&1 | Out-String)
          Write-Host $output
          if ($output -notmatch "RESULT_CODE=ADOPTED") {
            throw "Stable Apply did not adopt the current working runtime A-B"
          }

          $afterAdoptionHash = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($afterAdoptionHash -ne $abJarHash) {
            throw "Adoption modified the already-working patched JAR"
          }

          $sidecar = "$jar.solyan-libmpv-fix-v1.state"
          if (-not (Test-Path $sidecar)) { throw "Stable sidecar state was not created" }

          $backupLine = Get-Content $sidecar | Where-Object { $_ -like "BACKUP=*" } | Select-Object -First 1
          if (-not $backupLine) { throw "Stable sidecar does not contain BACKUP" }
          $stableBackup = $backupLine.Substring("BACKUP=".Length)

          if (-not (Test-Path $stableBackup)) { throw "Stable rollback backup was not created" }
          $stableBackupHash = (Get-FileHash $stableBackup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($stableBackupHash -ne $originalHash) {
            throw "Stable rollback backup does not equal the untouched A-B original"
          }

          & "tools\libmpv-fix-v1\ROLLBACK.ps1" -JarPath $jar
          if (-not $?) { throw "Stable rollback after adoption failed" }

          $restoredHash = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($restoredHash -ne $originalHash) {
            throw "Stable rollback after adoption did not restore the exact original JAR"
          }

          Write-Host "A-B TO STABLE MIGRATION SELF-TEST PASS"
