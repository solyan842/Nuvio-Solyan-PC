name: Import NuvioDesktop upstream

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone upstream Dev source
        run: |
          git clone --depth 1 --branch Dev https://github.com/NuvioMedia/NuvioDesktop.git /tmp/NuvioDesktop

      - name: Replace target with upstream source
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows/import-upstream.yml' \
            /tmp/NuvioDesktop/ ./

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import NuvioDesktop Dev upstream 796f10d" || exit 0
          git push origin HEAD:main
